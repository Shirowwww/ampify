name: MSVC setup
description: >
  WinUI 1.8 metadata and its C++/WinRT projection, ccache and the MSVC environment (Ninja), shared by every job that
  builds with MSVC. Sets WASDK_INCLUDE for the AMPIFY_WINAPPSDK_INCLUDE option of CMake.

inputs:
  cache-name:
    description: Name of the ccache cache (one per build, so two builds never fight over the same files)
    required: true
  projection:
    description: "'false' skips the WinUI projection, for builds without AMPIFY_XAML"
    default: 'true'

runs:
  using: composite
  steps:
    # The same script as scripts/build-msvc.ps1: the WinUI 1.8 metadata and the C++/WinRT projection.
    - name: Make the WinUI projection
      if: inputs.projection == 'true'
      shell: pwsh
      run: |
        $gen = Join-Path $env:RUNNER_TEMP 'winrt-gen'
        & ./scripts/msvc-winui.ps1 -Work $env:RUNNER_TEMP -Projection $gen
        "WASDK_INCLUDE=$gen" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8

    # Only the files a commit touches are compiled again. Ninja instead of the Visual Studio generator, so ccache can
    # sit in front of cl.exe (/Z7 in CMakeLists.txt keeps the debug information cacheable). Saved by msvc-cache-save,
    # even when the job fails or is cancelled.
    - uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/ccache
        key: ccache-${{ inputs.cache-name }}-${{ github.sha }}
        restore-keys: ccache-${{ inputs.cache-name }}-

    - name: Install ccache and open the MSVC environment
      shell: pwsh
      run: |
        $version = '4.10.2'
        $zip = Join-Path $env:RUNNER_TEMP 'ccache.zip'
        Invoke-WebRequest -Uri "https://github.com/ccache/ccache/releases/download/v$version/ccache-$version-windows-x86_64.zip" -OutFile $zip -TimeoutSec 120
        Expand-Archive -LiteralPath $zip -DestinationPath $env:RUNNER_TEMP -Force
        Join-Path $env:RUNNER_TEMP "ccache-$version-windows-x86_64" | Out-File -LiteralPath $env:GITHUB_PATH -Append -Encoding utf8
        "CCACHE_DIR=$(Join-Path $env:RUNNER_TEMP 'ccache')" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
        'CCACHE_MAXSIZE=2G' | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
        # The statistics of this build only (the restored cache carries those of every earlier run).
        & (Join-Path $env:RUNNER_TEMP "ccache-$version-windows-x86_64\ccache.exe") -z -d (Join-Path $env:RUNNER_TEMP 'ccache') | Out-Null
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
        $vars = cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set"
        foreach ($line in $vars) {
          if ($line -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8 }
        }
