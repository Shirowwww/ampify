name: Banc de test Windows

# Compile le kit (diffusion et banc) sous Linux, puis lance les tests sur un vrai Windows avec Apple Music installé.
# Le détail des tests et la façon d'en ajouter : docs/tests/banc-windows.md.
# Branche-agnostique : tourne sur chaque branche ** qui touche au code, et à la main (workflow_dispatch).

on:
  push:
    branches: ['**']
    paths:
      - 'bench/windows/**'
      - 'core/**'
      - 'kernel/**'
      - 'launcher/**'
      - 'win/**'
      - 'setup/**'
      - 'testkit/**'
      - 'extensions/**'
      - 'tests/**'
      - 'cli/**'
      - 'vendor/**'
      - 'examples/**'
      - 'themes/**'
      - 'catalog/**'
      - 'tools/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/windows-bench.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compiler les deux builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Installer le compilateur croisé pour Windows
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 cmake

      - name: Tests unitaires (Linux)
        run: |
          cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux --parallel
          ./build-linux/amk_tests

      - name: Build de diffusion (Windows x64, versions testées seulement)
        run: |
          cmake -S . -B build-diffusion \
            -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake \
            -DCMAKE_BUILD_TYPE=Release -DAMK_BUILD_TESTS=OFF -DAMK_BENCH=OFF
          cmake --build build-diffusion --parallel

      - name: Build de banc (Windows x64, accepte toute version, ne jamais diffuser)
        run: |
          cmake -S . -B build-banc \
            -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake \
            -DCMAKE_BUILD_TYPE=Release -DAMK_BUILD_TESTS=OFF -DAMK_BENCH=ON
          cmake --build build-banc --parallel

      - name: Préparer le paquet pour le banc
        run: |
          mkdir -p dist/diffusion dist/banc dist/cli
          cp build-diffusion/amk_launcher.exe build-diffusion/amk_kernel.dll build-diffusion/amk_setup.exe build-diffusion/AMK-Test.exe dist/diffusion/
          cp build-banc/amk_launcher.exe build-banc/amk_kernel.dll dist/banc/
          cp build-diffusion/amk.exe dist/cli/
          {
            echo "Commit : $GITHUB_SHA"
            echo "diffusion : AMK_BENCH=OFF, n'injecte que sur les versions de core/version_gate.hpp"
            echo "banc : AMK_BENCH=ON, accepte toute version d'Apple Music. Ne jamais diffuser."
          } > dist/BUILD_INFO.txt
          find dist -type f -exec ls -l {} +

      - uses: actions/upload-artifact@v4
        with:
          name: amk-builds
          path: dist
          if-no-files-found: error
          retention-days: 14

  bench:
    name: Banc Windows (Apple Music installé par winget)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: amk-builds
          path: dist

      - name: Lancer le banc
        shell: bash
        run: pwsh -NoProfile -File ./bench/windows/run-bench.ps1 -KitRoot dist -RepoRoot . -OutputRoot results

      - name: Publier les résultats (journaux, captures, rapport)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banc-windows-resultats
          path: results
          if-no-files-found: warn
          retention-days: 14

  # Même banc, kit compilé avec MSVC au lieu de MinGW (la projection C++/WinRT ne se génère pas avec MinGW).
  # Le kit MSVC est lié à la CRT statique, pour ne rien demander au processus d'Apple Music.
  bench-msvc:
    name: Banc Windows, kit compilé avec MSVC
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Compiler le kit avec MSVC (diffusion et banc)
        shell: pwsh
        run: |
          $dist = Join-Path $PWD 'dist-msvc'
          $variants = @(
            @{ Name = 'diffusion'; Bench = 'OFF' },
            @{ Name = 'banc'; Bench = 'ON' }
          )
          foreach ($variant in $variants) {
            $build = "build-msvc-$($variant.Name)"
            cmake -S . -B $build -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DAMK_BUILD_TESTS=OFF "-DAMK_BENCH=$($variant.Bench)"
            if ($LASTEXITCODE -ne 0) { throw "configuration MSVC $($variant.Name) en échec" }
            cmake --build $build --config Release --parallel
            if ($LASTEXITCODE -ne 0) { throw "compilation MSVC $($variant.Name) en échec" }
            $target = Join-Path $dist $variant.Name
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            Copy-Item -LiteralPath (Join-Path $build 'Release\amk_launcher.exe'), (Join-Path $build 'Release\amk_kernel.dll') -Destination $target
            if ($variant.Name -eq 'diffusion') {
              Copy-Item -LiteralPath (Join-Path $build 'Release\amk_setup.exe'), (Join-Path $build 'Release\AMK-Test.exe') -Destination $target
              New-Item -ItemType Directory -Force -Path (Join-Path $dist 'cli') | Out-Null
              Copy-Item -LiteralPath (Join-Path $build 'Release\amk.exe') -Destination (Join-Path $dist 'cli')
            }
          }
          "Commit : $env:GITHUB_SHA`ndiffusion : AMK_BENCH=OFF (MSVC)`nbanc : AMK_BENCH=ON (MSVC). Ne jamais diffuser." |
            Set-Content -LiteralPath (Join-Path $dist 'BUILD_INFO.txt')

      - name: Lancer le banc sur le kit MSVC
        shell: bash
        run: pwsh -NoProfile -File ./bench/windows/run-bench.ps1 -KitRoot dist-msvc -RepoRoot . -OutputRoot results-msvc

      - name: Publier les résultats MSVC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banc-windows-msvc-resultats
          path: results-msvc
          if-no-files-found: warn
          retention-days: 14

  # M8 : compile la branche des thèmes XAML avec MSVC. Les en-têtes C++/WinRT sont générés par cppwinrt.exe
  # à partir des .winmd du paquet Windows App SDK. Indépendant du banc M3.
  xaml-m8:
    name: Compiler M8 XAML (MSVC + C++/WinRT généré)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: m8

      - name: Télécharger le paquet Windows App SDK (NuGet) et lister ses .winmd
        shell: pwsh
        run: |
          $version = '1.6.240923002'
          $out = Join-Path $PWD 'm8\m8-out'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $package = Join-Path $env:RUNNER_TEMP 'wasdk.zip'
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.WindowsAppSDK/$version" -OutFile $package
          $folder = Join-Path $env:RUNNER_TEMP 'wasdk'
          Expand-Archive -LiteralPath $package -DestinationPath $folder -Force
          Get-ChildItem -LiteralPath $folder -Recurse -File |
            ForEach-Object { $_.FullName.Substring($folder.Length) } |
            Set-Content -LiteralPath (Join-Path $out 'wasdk-paquet.txt')
          $winmds = @(Get-ChildItem -LiteralPath $folder -Recurse -Filter '*.winmd' | Where-Object { $_.FullName -match 'uap10\.0' })
          if ($winmds.Count -eq 0) {
            $winmds = @(Get-ChildItem -LiteralPath $folder -Recurse -Filter '*.winmd')
          }
          if ($winmds.Count -eq 0) { throw 'aucun .winmd dans le paquet : voir m8/m8-out/wasdk-paquet.txt' }
          $winmds | ForEach-Object { $_.FullName } | Set-Content -LiteralPath (Join-Path $out 'wasdk-winmd.txt')
          Write-Host "$($winmds.Count) fichier(s) .winmd du Windows App SDK"

          # Microsoft.UI.Xaml.winmd référence les types WebView2 : cppwinrt doit aussi voir leurs .winmd.
          $webview = Join-Path $env:RUNNER_TEMP 'webview2.zip'
          Invoke-WebRequest -Uri 'https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2' -OutFile $webview
          $webFolder = Join-Path $env:RUNNER_TEMP 'webview2'
          Expand-Archive -LiteralPath $webview -DestinationPath $webFolder -Force
          Get-ChildItem -LiteralPath $webFolder -Recurse -File |
            ForEach-Object { $_.FullName.Substring($webFolder.Length) } |
            Set-Content -LiteralPath (Join-Path $out 'webview2-paquet.txt')
          $webWinmds = @(Get-ChildItem -LiteralPath $webFolder -Recurse -Filter '*WebView2*.winmd' |
            Group-Object Name | ForEach-Object { $_.Group[0] })
          if ($webWinmds.Count -eq 0) { throw 'aucun .winmd WebView2 dans le paquet : voir m8/m8-out/webview2-paquet.txt' }
          $webWinmds | ForEach-Object { $_.FullName } | Add-Content -LiteralPath (Join-Path $out 'wasdk-winmd.txt')
          Write-Host "$($webWinmds.Count) fichier(s) .winmd WebView2"

      - name: Générer la projection C++/WinRT (cppwinrt.exe du SDK Windows)
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'm8\m8-out'
          $kit = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10'
          $cppwinrt = Get-ChildItem -LiteralPath (Join-Path $kit 'bin') -Recurse -Filter 'cppwinrt.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $cppwinrt) { throw 'cppwinrt.exe introuvable dans le SDK Windows' }
          $sdkWinrt = Get-ChildItem -LiteralPath (Join-Path $kit 'Include') -Recurse -Directory -Filter 'winrt' -ErrorAction SilentlyContinue |
            Where-Object { $_.Parent.Name -eq 'cppwinrt' } | Select-Object -First 1
          if (-not $sdkWinrt) { throw 'dossier cppwinrt\winrt introuvable dans le SDK Windows' }

          $gen = Join-Path $out 'winrt-gen'
          New-Item -ItemType Directory -Force -Path $gen | Out-Null
          $arguments = @()
          foreach ($winmd in Get-Content -LiteralPath (Join-Path $out 'wasdk-winmd.txt')) {
            $arguments += @('-in', $winmd)
          }
          $arguments += @('-ref', 'sdk', '-out', $gen)
          & $cppwinrt.FullName @arguments 2>&1 | Tee-Object -FilePath (Join-Path $out 'cppwinrt.log')
          if ($LASTEXITCODE -ne 0) { throw "cppwinrt.exe a échoué (code $LASTEXITCODE) : voir m8/m8-out/cppwinrt.log" }

          # Les en-têtes de base (winrt/base.h, winrt/Windows.*.h) viennent du SDK : on les met à côté de la projection.
          $target = Join-Path $gen 'winrt'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path (Join-Path $sdkWinrt.FullName '*') -Destination $target -Recurse -Force
          if (-not (Test-Path -LiteralPath (Join-Path $target 'Microsoft.UI.Xaml.h'))) {
            throw 'winrt\Microsoft.UI.Xaml.h absent après génération : voir m8/m8-out/cppwinrt.log'
          }
          Write-Host "Projection : $gen (cppwinrt : $($cppwinrt.FullName))"
          "WASDK_INCLUDE=$gen" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configurer et compiler (MSVC, AMK_XAML=ON)
        shell: pwsh
        working-directory: m8
        run: |
          New-Item -ItemType Directory -Force -Path m8-out | Out-Null
          cmake -S . -B build -A x64 -DAMK_XAML=ON "-DAMK_WINAPPSDK_INCLUDE=$env:WASDK_INCLUDE" 2>&1 |
            Tee-Object -FilePath m8-out/configure.log
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath m8-out/build.log

      - name: Lancer amk_tests et amk_ui_thread_test
        if: always()
        shell: pwsh
        working-directory: m8
        run: |
          New-Item -ItemType Directory -Force -Path m8-out | Out-Null
          foreach ($exe in 'amk_tests.exe', 'amk_ui_thread_test.exe') {
            $found = Get-ChildItem -LiteralPath build -Recurse -Filter $exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $found) {
              "$exe : introuvable (compilation en échec ?)" | Add-Content -LiteralPath m8-out/tests.log
              continue
            }
            Copy-Item -LiteralPath $found.FullName -Destination m8-out
            & $found.FullName 2>&1 | Tee-Object -FilePath (Join-Path m8-out "$exe.log")
            "$exe : code de sortie $LASTEXITCODE" | Add-Content -LiteralPath m8-out/tests.log
          }
          Get-ChildItem -LiteralPath build -Recurse -Filter 'amk_kernel.dll' -ErrorAction SilentlyContinue |
            Select-Object -First 1 | Copy-Item -Destination m8-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amk-m8-xaml
          path: m8/m8-out
          if-no-files-found: warn
          retention-days: 14

  # Compile le kit avec MSVC, sans Windows App SDK : prouve que quickjs-ng et le noyau se construisent
  # avec le compilateur de l'utilisateur, et lance les tests unitaires sous Windows. Indépendant du job M8 ci-dessus.
  msvc-kit:
    name: Compiler le kit (MSVC) et lancer amk_tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configurer et compiler (MSVC, x64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path msvc-out | Out-Null
          cmake -S . -B build -A x64 > msvc-out/configure.log 2>&1
          if ($LASTEXITCODE -ne 0) { Get-Content msvc-out/configure.log -Tail 120; exit 1 }
          cmake --build build --config Release --parallel > msvc-out/build.log 2>&1
          if ($LASTEXITCODE -ne 0) { Get-Content msvc-out/build.log -Tail 200; exit 1 }

      - name: Lancer amk_tests
        shell: pwsh
        run: |
          $exe = Get-ChildItem -LiteralPath build -Recurse -Filter 'amk_tests.exe' | Select-Object -First 1
          if (-not $exe) { throw 'amk_tests.exe introuvable après la compilation' }
          & $exe.FullName > msvc-out/amk_tests.log 2>&1
          $code = $LASTEXITCODE
          Get-Content msvc-out/amk_tests.log -Tail 40
          if ($code -ne 0) { exit $code }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amk-msvc-kit
          path: msvc-out
          if-no-files-found: warn
          retention-days: 14
