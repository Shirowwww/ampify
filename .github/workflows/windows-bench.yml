name: Windows bench

# Builds Ampify (release and bench) on Linux, then runs the cases on a real Windows with Apple Music installed.
# The cases and how to add one: docs/development/bench-and-ci.md.
# Runs on every branch that touches the code, and by hand (workflow_dispatch). Pushes that only touch docs or
# other files outside the list below start nothing.

on:
  push:
    branches: ['**']
    paths:
      - 'bench/windows/**'
      # The signed-in bench is run by hand on a signed-in PC (it needs an Apple account): its files must not
      # restart this workflow.
      - '!bench/windows/live/**'
      - '!bench/windows/lib/uia.ps1'
      - '!bench/windows/lib/audio.ps1'
      - 'core/**'
      - 'kernel/**'
      - 'launcher/**'
      - 'win/**'
      - 'setup/**'
      - 'testkit/**'
      - 'extensions/**'
      - 'tests/**'
      - 'cli/**'
      - 'vendor/**'
      - 'examples/**'
      - 'themes/**'
      - 'catalog/**'
      - 'tools/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/windows-bench.yml'
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels the run in progress on the same branch. The main branch is never cancelled: each of its
# runs finishes, so a result exists for every commit that landed there.
concurrency:
  group: windows-bench-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Unit tests on Linux, in parallel with the Windows builds: the benches do not wait for them.
  linux-tests:
    name: Unit tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Tools and build cache
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-
      - name: Build and run ampify_tests
        run: |
          cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-linux
          ./build-linux/ampify_tests
          ccache --show-stats || true

  build:
    name: Build the two Windows builds (MinGW)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install the Windows cross compiler and the build cache
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 cmake ninja-build ccache

      # Only the files that changed since the last run are compiled again.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-mingw-${{ github.sha }}
          restore-keys: ccache-mingw-

      - name: Release build (Windows x64, tested versions only)
        run: |
          cmake -S . -B build-release -G Ninja -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake \
            -DCMAKE_BUILD_TYPE=Release -DAMPIFY_BUILD_TESTS=OFF -DAMPIFY_BENCH=OFF
          cmake --build build-release --parallel

      - name: Bench build (Windows x64, accepts any version, never ship)
        run: |
          cmake -S . -B build-bench -G Ninja -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake \
            -DCMAKE_BUILD_TYPE=Release -DAMPIFY_BUILD_TESTS=OFF -DAMPIFY_BENCH=ON
          cmake --build build-bench --parallel

      - name: Lay out the package for the bench
        run: |
          mkdir -p dist/release dist/bench dist/cli
          cp build-release/ampify_launcher.exe build-release/ampify_kernel.dll build-release/ampify_setup.exe build-release/Ampify-Test.exe build-release/ampify.exe dist/release/
          cp build-bench/ampify_launcher.exe build-bench/ampify_kernel.dll dist/bench/
          cp build-release/ampify.exe dist/cli/
          {
            echo "Commit: $GITHUB_SHA"
            echo "release: AMPIFY_BENCH=OFF, injects only on the versions of core/version_gate.hpp"
            echo "bench: AMPIFY_BENCH=ON, accepts any Apple Music version. Never ship."
          } > dist/BUILD_INFO.txt
          find dist -type f -exec ls -l {} +

      - uses: actions/upload-artifact@v4
        with:
          name: ampify-builds
          path: dist
          if-no-files-found: error
          retention-days: 14

  bench:
    name: Windows bench MinGW (${{ matrix.shard }})
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    # The cases run on parallel runners, each with its own Apple Music, instead of one after the other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: launch
            cases: normal-launch,release-version,bench-injection,safe-mode,atmos-leveler
          - shard: tools
            cases: cli-windows-tools,extension-hello,installer,cli-build-installed,test-kit,amp-player
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ampify-builds
          path: dist

      - name: Run the bench
        shell: bash
        run: pwsh -NoProfile -File ./bench/windows/run-bench.ps1 -KitRoot dist -RepoRoot . -OutputRoot results -Only "${{ matrix.cases }}"

      - name: Publish the results (logs, screenshots, report)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-bench-results-${{ matrix.shard }}
          path: results
          if-no-files-found: warn
          retention-days: 14

  # Same bench, on the kit built with MSVC (the compiler of the shipped build), XAML binding included. The kit comes
  # from the msvc-build job, which builds it once (static CRT, so nothing is asked of Apple Music's process).
  bench-msvc:
    name: Windows bench MSVC (${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 45
    needs: msvc-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: launch
            cases: normal-launch,release-version,bench-injection,safe-mode,atmos-leveler
          - shard: tools
            cases: cli-windows-tools,extension-hello,installer,cli-build-installed,test-kit,amp-player
          - shard: ui
            cases: ui-examples,ui-inspector,ui-theme-midnight,ui-surfaces
    steps:
      - uses: actions/checkout@v4

      # The two halves of the MSVC kit (release + cli, bench + ui), built side by side by msvc-build.
      - uses: actions/download-artifact@v4
        with:
          pattern: ampify-msvc-kit-*
          path: dist-msvc
          merge-multiple: true

      - name: Run the bench on the MSVC kit
        shell: bash
        run: pwsh -NoProfile -File ./bench/windows/run-bench.ps1 -KitRoot dist-msvc -RepoRoot . -OutputRoot results-msvc -Only "${{ matrix.cases }}"

      - name: Publish the MSVC results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-bench-msvc-results-${{ matrix.shard }}
          path: results-msvc
          if-no-files-found: warn
          retention-days: 14

  # Builds the XAML binding (themes, native rendering of the interfaces, Ampify card) with MSVC. The C++/WinRT headers
  # are generated by cppwinrt.exe from the WinUI 1.8 metadata (the one of Apple Music 1.1540+). Independent of the
  # MinGW bench.
  # Two runners side by side: the shipping build (with the MSVC unit tests) and the bench build, which only differs
  # by AMPIFY_BENCH and would otherwise wait for the first one.
  msvc-build:
    name: Build with MSVC and XAML (${{ matrix.variant }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [release, bench]
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      # Apple Music 1.1540+ is aligned on Windows App SDK 1.8: the projection comes from the WinUI 1.8 metadata, as in
      # AMExclusive (MIT, mod/scripts/Get-WinUIMetadata.ps1). Only the .winmd files are extracted, no DLL is
      # shipped. The SHA-256 of each package is recorded, the one of Microsoft.UI.Xaml.winmd is pinned.
      - name: Download the WinUI 1.8 metadata (NuGet) and check their hashes
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'src\build-out'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $metadata = Join-Path $env:RUNNER_TEMP 'winui-metadata'
          New-Item -ItemType Directory -Force -Path $metadata | Out-Null
          $expectedXaml = 'A824AB1E380E384C382CEC14AC5DAD9D4C1B91F519D512082F0E7E5D6AC109DE'
          $packages = @(
            @{ Id = 'microsoft.windowsappsdk.winui'; Version = '1.8.251222000'; Entries = @(
              'metadata/Microsoft.UI.Xaml.winmd', 'metadata/Microsoft.UI.Text.winmd') },
            @{ Id = 'microsoft.windowsappsdk.interactiveexperiences'; Version = '1.8.251217001'; Entries = @(
              'metadata/10.0.17763.0/Microsoft.UI.winmd',
              'metadata/10.0.17763.0/Microsoft.Foundation.winmd',
              'metadata/10.0.17763.0/Microsoft.Graphics.winmd') },
            @{ Id = 'microsoft.windowsappsdk.foundation'; Version = '1.8.251220000'; Entries = @(
              'metadata/Microsoft.Windows.ApplicationModel.Resources.winmd') },
            @{ Id = 'microsoft.web.webview2'; Version = '1.0.3179.45'; Entries = @(
              'lib/Microsoft.Web.WebView2.Core.winmd') }
          )
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $hashes = @()
          foreach ($package in $packages) {
            $uri = "https://api.nuget.org/v3-flatcontainer/$($package.Id)/$($package.Version)/$($package.Id).$($package.Version).nupkg"
            $archive = Join-Path $env:RUNNER_TEMP "$($package.Id).$($package.Version).nupkg"
            Invoke-WebRequest -Uri $uri -OutFile $archive -TimeoutSec 300
            $hashes += "$($package.Id) $($package.Version) $((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash)"
            $zip = [IO.Compression.ZipFile]::OpenRead($archive)
            try {
              foreach ($entryPath in $package.Entries) {
                $entry = $zip.GetEntry($entryPath)
                if (-not $entry) { throw "metadata missing from $($package.Id) $($package.Version): $entryPath" }
                $destination = Join-Path $metadata ([IO.Path]::GetFileName($entryPath))
                [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $destination, $true)
                $hashes += "  $entryPath $((Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash)"
              }
            } finally {
              $zip.Dispose()
            }
          }
          $hashes | Set-Content -LiteralPath (Join-Path $out 'winui-hashes.txt')
          $hashes | ForEach-Object { Write-Host $_ }
          $xaml = Join-Path $metadata 'Microsoft.UI.Xaml.winmd'
          $actual = (Get-FileHash -LiteralPath $xaml -Algorithm SHA256).Hash
          if ($actual -ne $expectedXaml) {
            throw "Microsoft.UI.Xaml.winmd: unexpected hash $actual (expected $expectedXaml)"
          }
          Write-Host "Microsoft.UI.Xaml.winmd checked: $actual"
          Get-ChildItem -LiteralPath $metadata -Filter '*.winmd' | ForEach-Object { $_.FullName } |
            Set-Content -LiteralPath (Join-Path $out 'wasdk-winmd.txt')

      - name: Generate the C++/WinRT projection (cppwinrt.exe from the Windows SDK)
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'src\build-out'
          $kit = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10'
          $cppwinrt = Get-ChildItem -LiteralPath (Join-Path $kit 'bin') -Recurse -Filter 'cppwinrt.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $cppwinrt) { throw 'cppwinrt.exe not found in the Windows SDK' }
          $sdkWinrt = Get-ChildItem -LiteralPath (Join-Path $kit 'Include') -Recurse -Directory -Filter 'winrt' -ErrorAction SilentlyContinue |
            Where-Object { $_.Parent.Name -eq 'cppwinrt' } | Select-Object -First 1
          if (-not $sdkWinrt) { throw 'cppwinrt\winrt folder not found in the Windows SDK' }

          $gen = Join-Path $out 'winrt-gen'
          New-Item -ItemType Directory -Force -Path $gen | Out-Null
          $arguments = @()
          foreach ($winmd in Get-Content -LiteralPath (Join-Path $out 'wasdk-winmd.txt')) {
            $arguments += @('-in', $winmd)
          }
          $arguments += @('-ref', 'sdk', '-out', $gen)
          & $cppwinrt.FullName @arguments 2>&1 | Tee-Object -FilePath (Join-Path $out 'cppwinrt.log')
          if ($LASTEXITCODE -ne 0) { throw "cppwinrt.exe failed (code $LASTEXITCODE): see src/build-out/cppwinrt.log" }

          # The base headers (winrt/base.h, winrt/Windows.*.h) come from the SDK: put them next to the projection.
          $target = Join-Path $gen 'winrt'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path (Join-Path $sdkWinrt.FullName '*') -Destination $target -Recurse -Force
          if (-not (Test-Path -LiteralPath (Join-Path $target 'Microsoft.UI.Xaml.h'))) {
            throw 'winrt\Microsoft.UI.Xaml.h missing after the generation: see src/build-out/cppwinrt.log'
          }
          Write-Host "Projection: $gen (cppwinrt: $($cppwinrt.FullName))"
          "WASDK_INCLUDE=$gen" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8

      # ccache keeps the compiled files from one run to the next: only the files a commit touches are compiled again.
      # Ninja instead of the Visual Studio generator, so ccache can sit in front of cl.exe.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-msvc-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: ccache-msvc-${{ matrix.variant }}-

      - name: Install ccache and open the MSVC environment (Ninja)
        shell: pwsh
        run: |
          $version = '4.10.2'
          $zip = Join-Path $env:RUNNER_TEMP 'ccache.zip'
          Invoke-WebRequest -Uri "https://github.com/ccache/ccache/releases/download/v$version/ccache-$version-windows-x86_64.zip" -OutFile $zip -TimeoutSec 120
          Expand-Archive -LiteralPath $zip -DestinationPath $env:RUNNER_TEMP -Force
          Join-Path $env:RUNNER_TEMP "ccache-$version-windows-x86_64" | Out-File -LiteralPath $env:GITHUB_PATH -Append -Encoding utf8
          "CCACHE_DIR=$(Join-Path $env:RUNNER_TEMP 'ccache')" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          'CCACHE_MAXSIZE=2G' | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          # The variables of vcvars64.bat (cl.exe, the SDK, ninja) for the next steps.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $vars = cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set"
          foreach ($line in $vars) {
            if ($line -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8 }
          }

      - name: Configure and build (MSVC, AMPIFY_XAML=ON)
        if: matrix.variant == 'release'
        shell: pwsh
        working-directory: src
        run: |
          New-Item -ItemType Directory -Force -Path build-out | Out-Null
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DAMPIFY_XAML=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded "-DAMPIFY_WINAPPSDK_INCLUDE=$env:WASDK_INCLUDE" 2>&1 |
            Tee-Object -FilePath build-out/configure.log
          if ($LASTEXITCODE -ne 0) { throw 'MSVC configuration failed: see build-out/configure.log' }
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build-out/build.log
          if ($LASTEXITCODE -ne 0) { throw 'MSVC build failed: see build-out/build.log' }
          ccache --show-stats
          # The shipping half of the MSVC kit, in the layout of the MinGW one: release (tested versions only), cli.
          $kit = Join-Path $PWD 'msvc-kit'
          foreach ($pair in @(@('release', @('ampify_launcher.exe', 'ampify_kernel.dll', 'ampify_setup.exe', 'Ampify-Test.exe', 'ampify.exe')), @('cli', @('ampify.exe')))) {
            $to = Join-Path $kit $pair[0]
            New-Item -ItemType Directory -Force -Path $to | Out-Null
            foreach ($name in $pair[1]) {
              $found = Get-ChildItem -LiteralPath build -Recurse -Filter $name | Select-Object -First 1
              if (-not $found) { throw "$name missing from build" }
              Copy-Item -LiteralPath $found.FullName -Destination $to
            }
          }
          "Commit: $env:GITHUB_SHA`nrelease: AMPIFY_BENCH=OFF (MSVC, XAML)`nbench and ui: AMPIFY_BENCH=ON (MSVC, XAML). Never ship." |
            Set-Content -LiteralPath (Join-Path $kit 'BUILD_INFO.txt')

      # Same build in bench mode (any Apple Music version), for the MSVC bench, which runs the UI cases (example
      # themes, inspector, midnight theme, native interface) in the real Apple Music. Never ship it.
      - name: Build the bench build (AMPIFY_XAML=ON, AMPIFY_BENCH=ON)
        if: matrix.variant == 'bench'
        shell: pwsh
        working-directory: src
        run: |
          cmake -S . -B build-bench -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DAMPIFY_XAML=ON -DAMPIFY_BENCH=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded "-DAMPIFY_WINAPPSDK_INCLUDE=$env:WASDK_INCLUDE"
          if ($LASTEXITCODE -ne 0) { throw 'UI bench build configuration failed' }
          # Only what the bench kit takes from this build.
          cmake --build build-bench --config Release --parallel --target ampify_launcher ampify_kernel ampify_theme_check
          if ($LASTEXITCODE -ne 0) { throw 'UI bench build failed' }
          ccache --show-stats
          # The bench half of the MSVC kit: bench (any version, never shipped), ui (same build, for the interface cases).
          $kit = Join-Path $PWD 'msvc-kit'
          foreach ($pair in @(@('bench', @('ampify_launcher.exe', 'ampify_kernel.dll')), @('ui', @('ampify_launcher.exe', 'ampify_kernel.dll', 'ampify_theme_check.exe')))) {
            $to = Join-Path $kit $pair[0]
            New-Item -ItemType Directory -Force -Path $to | Out-Null
            foreach ($name in $pair[1]) {
              $found = Get-ChildItem -LiteralPath build-bench -Recurse -Filter $name | Select-Object -First 1
              if (-not $found) { throw "$name missing from build-bench" }
              Copy-Item -LiteralPath $found.FullName -Destination $to
            }
          }
          New-Item -ItemType Directory -Force -Path (Join-Path $kit 'ui\themes'), (Join-Path $kit 'ui\examples') | Out-Null
          Copy-Item -LiteralPath themes/examples -Destination (Join-Path $kit 'ui\themes') -Recurse
          # The example extension of the interface case (63-ui-surfaces): a React panel.
          Copy-Item -LiteralPath examples/react-panel -Destination (Join-Path $kit 'ui\examples') -Recurse

      - uses: actions/upload-artifact@v4
        with:
          name: ampify-msvc-kit-${{ matrix.variant }}
          path: src/msvc-kit
          if-no-files-found: error
          retention-days: 14

      - name: Run ampify_tests and ampify_ui_thread_test
        if: ${{ !cancelled() && matrix.variant == 'release' }}
        shell: pwsh
        working-directory: src
        run: |
          New-Item -ItemType Directory -Force -Path build-out | Out-Null
          $failed = @()
          foreach ($exe in 'ampify_tests.exe', 'ampify_ui_thread_test.exe') {
            $found = Get-ChildItem -LiteralPath build -Recurse -Filter $exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $found) {
              "${exe}: not found (build failed?)" | Add-Content -LiteralPath build-out/tests.log
              $failed += $exe
              continue
            }
            Copy-Item -LiteralPath $found.FullName -Destination build-out
            & $found.FullName 2>&1 | Tee-Object -FilePath (Join-Path build-out "$exe.log")
            $code = $LASTEXITCODE
            "${exe}: exit code $code" | Add-Content -LiteralPath build-out/tests.log
            if ($code -ne 0) { $failed += $exe }
          }
          Get-ChildItem -LiteralPath build -Recurse -Filter 'ampify_kernel.dll' -ErrorAction SilentlyContinue |
            Select-Object -First 1 | Copy-Item -Destination build-out
          # This job is also the MSVC unit test job: a failing test fails it.
          if ($failed.Count -gt 0) { throw "tests failed on Windows: $($failed -join ', ')" }

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && matrix.variant == 'release' }}
        with:
          name: ampify-msvc-logs
          path: src/build-out
          if-no-files-found: warn
          retention-days: 14
