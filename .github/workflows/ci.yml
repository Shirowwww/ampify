name: CI

# Unit tests on Linux and Windows, then the bench: the cases run on a real Windows with Apple Music installed.
# The cases and how to add one: docs/development/testing.md.
# Runs on pushes to dev that touch the code, and by hand on any branch. Work reaches main through dev with the same
# commits, so main and pull requests need no run of their own.

on:
  push:
    branches: [dev]
    paths:
      # Everything the tests and the build read: a change to any of it starts a run.
      - 'bench/windows/**'
      # The signed-in bench is run by hand on a signed-in PC (it needs an Apple account).
      - '!bench/windows/live/**'
      - 'src/**'
      - 'extensions/**'
      - 'apps/**'
      - 'tests/**'
      - 'vendor/**'
      - 'examples/**'
      - 'themes/**'
      - 'tools/**'
      - 'schemas/**'
      - 'knowledge/**'
      - 'docs/**'
      - 'scripts/**'
      - 'cmake/**'
      - 'facts/**'
      - 'CMakeLists.txt'
      - 'package.json'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels the run in progress on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-tests:
    name: Unit tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja, ccache and jsonschema (the validator tests compare against it)
        run: sudo apt-get install -y --no-install-recommends ninja-build ccache python3-jsonschema || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build ccache python3-jsonschema)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-
      - name: Build and run ampify_tests
        run: |
          ccache -z
          cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-linux --target ampify_tests ampify
          ./build-linux/ampify_tests
          ccache --show-stats
      # The command line, the catalog tools and the JavaScript elements, against the binary just built.
      - name: Tool and element tests
        env:
          AMPIFY_BIN: ${{ github.workspace }}/build-linux/ampify
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py'
          node --test tools/test_examples.mjs
          npm run lint:js

  # The MSVC unit tests build their own targets beside the kits, so the bench never waits for them.
  windows-tests:
    name: Unit tests (Windows, MSVC)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/msvc-setup
        with:
          cache-name: msvc-tests
          projection: 'false'
      - name: Build and run ampify_tests
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { throw 'configuration failed' }
          cmake --build build --parallel --target ampify_tests
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
          & (Join-Path build 'ampify_tests.exe')
          if ($LASTEXITCODE -ne 0) { throw 'tests failed' }

  # Two kits side by side: release (tested Apple Music versions only, what ships) and bench (any version, plus the
  # files of the interface cases). Never ship the bench kit.
  windows-build:
    name: Build the ${{ matrix.variant }} kit (MSVC)
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: release
            bench: 'OFF'
            targets: ampify_launcher ampify_kernel ampify_setup ampify
          - variant: bench
            bench: 'ON'
            targets: ampify_launcher ampify_kernel ampify
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/msvc-setup
        with:
          cache-name: msvc-${{ matrix.variant }}
      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DAMPIFY_XAML=ON -DAMPIFY_BENCH=${{ matrix.bench }} -DAMPIFY_BUILD_TESTS=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded "-DAMPIFY_WINAPPSDK_INCLUDE=$env:WASDK_INCLUDE"
          if ($LASTEXITCODE -ne 0) { throw 'configuration failed' }
          cmake --build build --parallel --target ${{ matrix.targets }}
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
          ccache --show-stats
      # The layout lives in scripts/bench-kit.ps1 (also used on a PC); BUILD_INFO.txt comes with the release part.
      - name: Lay out the kit
        shell: pwsh
        run: ./scripts/bench-kit.ps1 -Variant ${{ matrix.variant }} -ReleaseBuild build -BenchBuild build -Out msvc-kit
      - uses: actions/upload-artifact@v5
        with:
          name: ampify-msvc-kit-${{ matrix.variant }}
          path: msvc-kit
          if-no-files-found: error
          retention-days: 14

  # The case ids are read from the case files (bench/windows/shards.sh), so a new case needs no edit here.
  bench-plan:
    name: Split the bench cases
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v5
      - id: plan
        run: echo "shards=$(bash bench/windows/shards.sh 4)" >> "$GITHUB_OUTPUT"

  # The cases on parallel runners, each with its own Apple Music, dealt out in turn so the groups weigh about the same.
  bench:
    name: Bench (group ${{ matrix.shard }})
    needs: [windows-build, bench-plan]
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.bench-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: ampify-msvc-kit-*
          path: dist-msvc
          merge-multiple: true
      - name: Run the bench
        shell: pwsh
        run: ./bench/windows/run-bench.ps1 -KitRoot dist-msvc -RepoRoot . -OutputRoot results -Only "${{ matrix.cases }}"
      - name: Publish the results (logs, screenshots, report)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: bench-results-${{ matrix.shard }}
          path: results
          if-no-files-found: warn
          retention-days: 14
