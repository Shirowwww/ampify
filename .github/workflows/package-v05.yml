name: Paquet de test V0.5

# Assemble le paquet de test V0.5 (amk-kit-<version>-windows-x64.zip et SHA256SUMS.txt) à partir du kit MSVC d'un
# run déjà vert du banc Windows (windows-bench.yml, artefact amk-msvc-kit). Lancé à la main seulement : le paquet est
# publié comme artefact du run, jamais comme release. Une release demande l'accord du propriétaire.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Identifiant du run de windows-bench.yml dont on prend l'artefact amk-msvc-kit"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  package:
    name: Assembler le paquet V0.5
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Lire le commit du run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          case "$RUN_ID" in (''|*[!0-9]*) echo "run_id doit être un nombre : $RUN_ID" >&2; exit 1 ;; esac
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '"sha=\(.head_sha)\nworkflow=\(.path)\nconclusion=\(.conclusion)"' >> "$GITHUB_OUTPUT"

      - name: Vérifier que le run vient du banc Windows
        env:
          RUN_ID: ${{ inputs.run_id }}
          RUN_SHA: ${{ steps.run.outputs.sha }}
          WORKFLOW: ${{ steps.run.outputs.workflow }}
          CONCLUSION: ${{ steps.run.outputs.conclusion }}
        run: |
          echo "Run $RUN_ID : $WORKFLOW, conclusion $CONCLUSION, commit $RUN_SHA"
          case "$WORKFLOW" in
            .github/workflows/windows-bench.yml|.github/workflows/windows-bench.yml@*) ;;
            *) echo "ce run ne vient pas de windows-bench.yml" >&2; exit 1 ;;
          esac
          [ "$CONCLUSION" = "success" ] || echo "::warning::le run $RUN_ID n'est pas entièrement vert ($CONCLUSION) : vérifiez les bancs avant de livrer"

      # Le script, le guide et les exemples viennent de la branche choisie au lancement (elle doit contenir
      # scripts/package-v05.sh). Le script refuse des binaires d'une autre version du kit.
      - uses: actions/checkout@v4

      - name: Comparer les commits
        env:
          RUN_SHA: ${{ steps.run.outputs.sha }}
        run: |
          if [ "$RUN_SHA" != "$GITHUB_SHA" ]; then
            echo "::warning::kit compilé au commit $RUN_SHA, script et exemples pris au commit $GITHUB_SHA"
          fi

      - uses: actions/download-artifact@v4
        with:
          name: amk-msvc-kit
          path: amk-msvc-kit
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Assembler le zip
        env:
          RUN_SHA: ${{ steps.run.outputs.sha }}
        run: bash scripts/package-v05.sh --msvc amk-msvc-kit --out dist --commit "$RUN_SHA"

      - name: Contenu du paquet
        run: |
          unzip -l dist/amk-kit-*-windows-x64.zip
          cat dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: amk-kit-v05-paquet
          path: |
            dist/amk-kit-*-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
