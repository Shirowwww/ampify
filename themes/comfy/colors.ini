; Comfy: a slate palette of its own, after the idea of Spicetify's Comfy theme.
; Each key replaces the brush of the same name in the app and serves as $name in user.css. These are the Fluent
; brushes (Brush suffix). The panels, cards and hover colors of user.css read them, so every scheme restyles it.

