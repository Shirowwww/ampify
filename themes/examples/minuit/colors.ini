; Schémas de couleurs : chaque clé remplace la ressource de même nom dans l'app, et sert de $nom dans user.css.
; Ce sont les pinceaux Fluent (suffixe Brush) : les couleurs sans suffixe sont lues par les pinceaux de WinUI dans
; leur propre dictionnaire et ne changent rien à l'écran. La liste complète est dans journal\inspector.txt.
; Le premier schéma est celui par défaut : il doit donc contenir les mêmes clés que le second.

[Base]
SolidBackgroundFillColorBaseBrush = EEF2FA
ApplicationPageBackgroundThemeBrush = EEF2FA
LayerFillColorDefaultBrush = F6F8FD
CardBackgroundFillColorDefaultBrush = FFFFFF
ControlFillColorDefaultBrush = FFFFFF
AccentFillColorDefaultBrush = 2F6BFF
TextFillColorPrimaryBrush = 0B1221
TextFillColorSecondaryBrush = 3C4A66

[Dark]
SolidBackgroundFillColorBaseBrush = 0B1221
ApplicationPageBackgroundThemeBrush = 0B1221
LayerFillColorDefaultBrush = 101A30
CardBackgroundFillColorDefaultBrush = 15203A
ControlFillColorDefaultBrush = 1A2747
AccentFillColorDefaultBrush = 5B9BFF
TextFillColorPrimaryBrush = E8EEFF
TextFillColorSecondaryBrush = A9B8DA
